[project]
name = "mathcastle"
version = "1.0.0"
description = "A math adventure in Streamlit: 4 levels, 3 doors each, 1 enemy per level."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.37",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]